name: Build FFmpeg Binaries

on:
  workflow_run:
    workflows: ['Build Environment Image']
    types: [completed]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/ffmpeg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-version:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get FFmpeg version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.ffmpeg_version }}" ]; then
            VERSION="${{ github.event.inputs.ffmpeg_version }}"
          else
            VERSION=$(curl -q -LSsf https://ffmpeg.org/releases/ | grep -oP 'ffmpeg-\K[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V | tail -1)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

  # ============================================================
  # 7 targets — run inside the pre-baked :build image (Alpine)
  # ============================================================
  build:
    name: ${{ matrix.target }}
    needs: get-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/binmgr/ffmpeg:build
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - darwin-amd64
          - darwin-arm64
          - freebsd-amd64
          - freebsd-arm64
    steps:
      - name: Build FFmpeg
        run: build-ffmpeg ${{ matrix.target }} ${{ needs.get-version.outputs.version }}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-${{ matrix.target }}
          path: /output/
          retention-days: 7

  # ============================================================
  # windows-arm64 — llvm-mingw is a glibc binary that crashes on
  # Alpine/musl; run this target on ubuntu-latest instead.
  # ============================================================
  windows-arm64:
    name: windows-arm64
    needs: get-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_MINGW_VERSION: '20260505'
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget xz-utils nasm yasm pkg-config

      - name: Install llvm-mingw
        run: |
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          sudo tar xJf "llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -C /opt
          echo "/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg ${{ needs.get-version.outputs.version }} for windows-arm64
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          wget -q "https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz"
          tar xJf "ffmpeg-${VERSION}.tar.xz"
          cd "ffmpeg-${VERSION}"
          ./configure \
            --prefix=/tmp/ffmpeg-install \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-cross-compile \
            --cross-prefix=aarch64-w64-mingw32- \
            --arch=aarch64 \
            --target-os=mingw32 \
            --cc=aarch64-w64-mingw32-clang \
            --cxx=aarch64-w64-mingw32-clang++ \
            --pkg-config=pkg-config \
            --pkg-config-flags='--static' \
            --extra-cflags='-O2' \
            --extra-ldflags='-static'
          make -j"$(nproc)"
          mkdir -p "${GITHUB_WORKSPACE}/output"
          cp ffmpeg.exe  "${GITHUB_WORKSPACE}/output/ffmpeg-windows-arm64.exe"
          cp ffprobe.exe "${GITHUB_WORKSPACE}/output/ffprobe-windows-arm64.exe"
          echo "${VERSION}" > "${GITHUB_WORKSPACE}/output/VERSION"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-arm64
          path: ${{ github.workspace }}/output/
          retention-days: 7

  # ============================================================
  # Release — only after all 8 builds succeed
  # ============================================================
  release:
    needs: [get-version, build, windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Get YYMM tag
        id: yymm
        run: echo "tag=$(date -u +'%y%m')" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          mkdir -p staging release

          # Stage all built files flat
          find artifacts -type f ! -name VERSION -exec cp {} staging/ \; 2>/dev/null || true

          # Make unix binaries executable
          chmod +x staging/ffmpeg-linux-*   staging/ffprobe-linux-*   2>/dev/null || true
          chmod +x staging/ffplay-linux-*                              2>/dev/null || true
          chmod +x staging/ffmpeg-darwin-*  staging/ffprobe-darwin-*  2>/dev/null || true
          chmod +x staging/ffmpeg-freebsd-* staging/ffprobe-freebsd-* 2>/dev/null || true

          # Direct ffmpeg binaries — one per target, kept as-is
          for f in staging/ffmpeg-*; do
            [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
          done

          # tar.gz archives for unix targets: ffmpeg + ffprobe + ffplay (linux only)
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 freebsd-amd64 freebsd-arm64; do
            tmpdir="$(mktemp -d)"
            for tool in ffmpeg ffprobe ffplay; do
              src="staging/${tool}-${target}"
              if [ -f "$src" ]; then
                cp "$src" "${tmpdir}/${tool}"
                chmod +x "${tmpdir}/${tool}"
              fi
            done
            if [ "$(ls -A "$tmpdir")" ]; then
              (cd "$tmpdir" && tar czf "${GITHUB_WORKSPACE}/release/ffmpeg-${target}.tar.gz" -- *)
            fi
            rm -rf "$tmpdir"
          done

          # zip archives for windows targets: ffmpeg.exe + ffprobe.exe
          for target in windows-amd64 windows-arm64; do
            tmpdir="$(mktemp -d)"
            for tool in ffmpeg ffprobe; do
              src="staging/${tool}-${target}.exe"
              [ -f "$src" ] && cp "$src" "${tmpdir}/${tool}.exe"
            done
            if [ "$(ls -A "$tmpdir")" ]; then
              (cd "$tmpdir" && zip "${GITHUB_WORKSPACE}/release/ffmpeg-${target}.zip" -- *.exe)
            fi
            rm -rf "$tmpdir"
          done

          # SHA256 checksums over all release assets
          cd "${GITHUB_WORKSPACE}/release"
          sha256sum -- * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ needs.get-version.outputs.tag }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ needs.get-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "FFmpeg ${{ needs.get-version.outputs.version }}" \
            --notes "Static FFmpeg binaries — Linux, Windows, macOS, FreeBSD (amd64/arm64)" \
            release/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker context
        run: |
          cp staging/ffmpeg-linux-amd64  .
          cp staging/ffmpeg-linux-arm64  .
          cp staging/ffprobe-linux-amd64 .
          cp staging/ffprobe-linux-arm64 .
          cp staging/ffplay-linux-amd64  . 2>/dev/null || true
          cp staging/ffplay-linux-arm64  . 2>/dev/null || true

      - name: Build and push runtime image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.get-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.yymm.outputs.tag }}
