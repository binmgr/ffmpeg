variables:
  GIT_DEPTH: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/ffmpeg

stages:
  - version
  - security
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

get-version:
  stage: version
  image: alpine:3
  script:
    - apk add --no-cache curl
    - |
      if [ -n "${FFMPEG_VERSION_OVERRIDE}" ]; then
        VERSION="${FFMPEG_VERSION_OVERRIDE}"
      else
        VERSION=$(curl -q -LSsf https://ffmpeg.org/releases/ | grep -oE 'ffmpeg-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar' | sed -e 's/^ffmpeg-//' -e 's/\.tar$//' | sort -uV | tail -1)
      fi
      echo "FFMPEG_VERSION=${VERSION}" > version.env
      echo "FFMPEG_TAG=v${VERSION}" >> version.env
  artifacts:
    reports:
      dotenv: version.env

secret-scan:
  stage: security
  image:
    name: trufflesecurity/trufflehog:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --since-commit HEAD~1 --fail --only-verified

image-scan:
  stage: security
  image: alpine:3
  variables:
    TRIVY_VERSION: '0.70.0'
  script:
    - apk add --no-cache wget
    - wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
    - tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
    - |
      # Build image is informational only (contains many tools)
      ./trivy image --exit-code 0 --severity CRITICAL,HIGH --no-progress "${REGISTRY}/${IMAGE_NAME}:build" || true
    - |
      # Runtime image is the distributed artifact — fail on CRITICAL/HIGH CVEs
      if ./trivy image --exit-code 0 --severity LOW "${REGISTRY}/${IMAGE_NAME}:latest" > /dev/null 2>&1; then
        ./trivy image --exit-code 1 --severity CRITICAL,HIGH --no-progress "${REGISTRY}/${IMAGE_NAME}:latest"
      else
        echo "Runtime image not yet published — skipping scan"
      fi

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [get-version]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - |
      # Try the published build image, else build it locally (self-hosted runners without registry access)
      if docker pull "${REGISTRY}/${IMAGE_NAME}:build"; then
        docker tag "${REGISTRY}/${IMAGE_NAME}:build" local/ffmpeg:build
      else
        docker build -f docker/Dockerfile.build -t local/ffmpeg:build .
      fi
    - mkdir -p artifacts
    - |
      CID="ffmpeg-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)"
      docker create --name "${CID}" local/ffmpeg:build build-ffmpeg "${TARGET_OS}-${TARGET_ARCH}" "${FFMPEG_VERSION}"
      docker start -a "${CID}"
      docker cp "${CID}:/output/." artifacts/
      docker rm "${CID}"
  artifacts:
    paths: [artifacts/]
    expire_in: 1 day

build-linux-amd64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-linux-arm64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: arm64, BINARY_EXT: "" }

build-windows-amd64:
  extends: .build
  variables: { TARGET_OS: windows, TARGET_ARCH: amd64, BINARY_EXT: ".exe" }

build-darwin-amd64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-darwin-arm64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: arm64, BINARY_EXT: "" }

build-windows-arm64:
  stage: build
  image: ubuntu:22.04
  needs: [get-version]
  variables:
    DEBIAN_FRONTEND: noninteractive
    LLVM_MINGW_VERSION: '20260505'
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget xz-utils nasm yasm pkg-config make ca-certificates
    - wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
    - tar xJf "llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -C /opt
    - |
      export PATH="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin:${PATH}"
      wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
      tar xJf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
      cd "ffmpeg-${FFMPEG_VERSION}"
      ./configure \
        --prefix=/tmp/ffmpeg-install \
        --enable-gpl --enable-version3 --enable-nonfree \
        --enable-static --disable-shared --disable-debug --disable-doc --disable-ffplay \
        --enable-cross-compile --cross-prefix=aarch64-w64-mingw32- --arch=aarch64 --target-os=mingw32 \
        --cc=aarch64-w64-mingw32-clang --cxx=aarch64-w64-mingw32-clang++ \
        --pkg-config=pkg-config --pkg-config-flags='--static' \
        --extra-cflags='-O2' --extra-ldflags='-static'
      make -j"$(nproc)"
      mkdir -p "${CI_PROJECT_DIR}/artifacts"
      cp ffmpeg.exe "${CI_PROJECT_DIR}/artifacts/ffmpeg-windows-arm64.exe"
      cp ffprobe.exe "${CI_PROJECT_DIR}/artifacts/ffprobe-windows-arm64.exe"
  artifacts:
    paths: [artifacts/]
    expire_in: 1 day

build-freebsd-amd64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-freebsd-arm64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: arm64, BINARY_EXT: "" }

release:
  stage: release
  image: alpine:3
  needs:
    - get-version
    - build-linux-amd64
    - build-linux-arm64
    - build-windows-amd64
    - build-windows-arm64
    - build-darwin-amd64
    - build-darwin-arm64
    - build-freebsd-amd64
    - build-freebsd-arm64
  script:
    - apk add --no-cache curl jq coreutils zip tar
    - |
      mkdir -p staging release

      # Stage all built files flat
      find artifacts -type f ! -name VERSION -exec cp {} staging/ \; 2>/dev/null || true

      # Make unix binaries executable
      chmod +x staging/ffmpeg-linux-*   staging/ffprobe-linux-*   2>/dev/null || true
      chmod +x staging/ffplay-linux-*                              2>/dev/null || true
      chmod +x staging/ffmpeg-darwin-*  staging/ffprobe-darwin-*  2>/dev/null || true
      chmod +x staging/ffmpeg-freebsd-* staging/ffprobe-freebsd-* 2>/dev/null || true

      # Direct ffmpeg binaries — one per target, kept as-is
      for f in staging/ffmpeg-*; do
        [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
      done

      # tar.gz archives for unix targets: ffmpeg + ffprobe + ffplay (linux only)
      for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 freebsd-amd64 freebsd-arm64; do
        tmpdir="$(mktemp -d)"
        for tool in ffmpeg ffprobe ffplay; do
          src="staging/${tool}-${target}"
          if [ -f "$src" ]; then
            cp "$src" "${tmpdir}/${tool}"
            chmod +x "${tmpdir}/${tool}"
          fi
        done
        if [ "$(ls -A "$tmpdir")" ]; then
          (cd "$tmpdir" && tar czf "${CI_PROJECT_DIR}/release/ffmpeg-${target}.tar.gz" -- *)
        fi
        rm -rf "$tmpdir"
      done

      # zip archives for windows targets: ffmpeg.exe + ffprobe.exe
      for target in windows-amd64 windows-arm64; do
        tmpdir="$(mktemp -d)"
        for tool in ffmpeg ffprobe; do
          src="staging/${tool}-${target}.exe"
          [ -f "$src" ] && cp "$src" "${tmpdir}/${tool}.exe"
        done
        if [ "$(ls -A "$tmpdir")" ]; then
          (cd "$tmpdir" && zip "${CI_PROJECT_DIR}/release/ffmpeg-${target}.zip" -- *.exe)
        fi
        rm -rf "$tmpdir"
      done

      # SHA256 checksums over all release assets
      cd "${CI_PROJECT_DIR}/release"
      sha256sum -- * > SHA256SUMS.txt

      curl -sf -X DELETE -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${FFMPEG_TAG}" || true
      curl -sf -X DELETE -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/${FFMPEG_TAG}" || true
      curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags" \
        -d "tag_name=${FFMPEG_TAG}&ref=${CI_COMMIT_SHA}" || true
      curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        -H "Content-Type: application/json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        -d "{\"tag_name\":\"${FFMPEG_TAG}\",\"name\":\"FFmpeg ${FFMPEG_VERSION}\",\"description\":\"FFmpeg ${FFMPEG_VERSION} static builds\"}"

      for file in *; do
        [ -f "$file" ] || continue
        UPLOAD=$(curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          -F "file=@${file}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads" | jq -r '.full_path')
        curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${FFMPEG_TAG}/assets/links" \
          -d "name=${file}&url=${CI_SERVER_URL}/${CI_PROJECT_PATH}${UPLOAD}"
      done
