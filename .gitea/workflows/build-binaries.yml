name: Build Binaries

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - '.gitea/workflows/build-binaries.yml'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (empty for latest)'
        required: false
        default: ''

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get FFmpeg version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.ffmpeg_version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(curl -q -LSsf https://ffmpeg.org/releases/ | grep -oP 'ffmpeg-\K[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V | tail -1)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: get-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - darwin-amd64
          - darwin-arm64
          - freebsd-amd64
          - freebsd-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get build image
        run: |
          if docker pull ghcr.io/binmgr/ffmpeg:build; then
            docker tag ghcr.io/binmgr/ffmpeg:build local/ffmpeg:build
          else
            docker build -f docker/Dockerfile.build -t local/ffmpeg:build .
          fi

      - name: Build FFmpeg
        env:
          FFMPEG_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p out
          docker run --rm --name "ffmpeg-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            -v "$PWD/out:/output" local/ffmpeg:build \
            build-ffmpeg "${{ matrix.target }}" "${FFMPEG_VERSION}"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/
          retention-days: 7

  windows-arm64:
    name: windows-arm64
    needs: get-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_MINGW_VERSION: '20260505'
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget xz-utils nasm yasm pkg-config

      - name: Install llvm-mingw
        run: |
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          sudo tar xJf "llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -C /opt
          echo "/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg ${{ needs.get-version.outputs.version }} for windows-arm64
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          wget -q "https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz"
          tar xJf "ffmpeg-${VERSION}.tar.xz"
          cd "ffmpeg-${VERSION}"
          ./configure \
            --prefix=/tmp/ffmpeg-install \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-cross-compile \
            --cross-prefix=aarch64-w64-mingw32- \
            --arch=aarch64 \
            --target-os=mingw32 \
            --cc=aarch64-w64-mingw32-clang \
            --cxx=aarch64-w64-mingw32-clang++ \
            --pkg-config=pkg-config \
            --pkg-config-flags='--static' \
            --extra-cflags='-O2' \
            --extra-ldflags='-static'
          make -j"$(nproc)"
          mkdir -p "${GITHUB_WORKSPACE}/output"
          cp ffmpeg.exe  "${GITHUB_WORKSPACE}/output/ffmpeg-windows-arm64.exe"
          cp ffprobe.exe "${GITHUB_WORKSPACE}/output/ffprobe-windows-arm64.exe"
          echo "${VERSION}" > "${GITHUB_WORKSPACE}/output/VERSION"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-arm64
          path: ${{ github.workspace }}/output/
          retention-days: 7

  release:
    needs: [get-version, build, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release
        run: |
          mkdir -p staging release

          # Stage all built files flat
          find artifacts -type f ! -name VERSION -exec cp {} staging/ \; 2>/dev/null || true

          # Make unix binaries executable
          chmod +x staging/ffmpeg-linux-*   staging/ffprobe-linux-*   2>/dev/null || true
          chmod +x staging/ffplay-linux-*                              2>/dev/null || true
          chmod +x staging/ffmpeg-darwin-*  staging/ffprobe-darwin-*  2>/dev/null || true
          chmod +x staging/ffmpeg-freebsd-* staging/ffprobe-freebsd-* 2>/dev/null || true

          # Direct ffmpeg binaries — one per target, kept as-is
          for f in staging/ffmpeg-*; do
            [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
          done

          # tar.gz archives for unix targets: ffmpeg + ffprobe + ffplay (linux only)
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 freebsd-amd64 freebsd-arm64; do
            tmpdir="$(mktemp -d)"
            for tool in ffmpeg ffprobe ffplay; do
              src="staging/${tool}-${target}"
              if [ -f "$src" ]; then
                cp "$src" "${tmpdir}/${tool}"
                chmod +x "${tmpdir}/${tool}"
              fi
            done
            if [ "$(ls -A "$tmpdir")" ]; then
              (cd "$tmpdir" && tar czf "${GITHUB_WORKSPACE}/release/ffmpeg-${target}.tar.gz" -- *)
            fi
            rm -rf "$tmpdir"
          done

          # zip archives for windows targets: ffmpeg.exe + ffprobe.exe
          for target in windows-amd64 windows-arm64; do
            tmpdir="$(mktemp -d)"
            for tool in ffmpeg ffprobe; do
              src="staging/${tool}-${target}.exe"
              [ -f "$src" ] && cp "$src" "${tmpdir}/${tool}.exe"
            done
            if [ "$(ls -A "$tmpdir")" ]; then
              (cd "$tmpdir" && zip "${GITHUB_WORKSPACE}/release/ffmpeg-${target}.zip" -- *.exe)
            fi
            rm -rf "$tmpdir"
          done

          # SHA256 checksums over all release assets
          cd "${GITHUB_WORKSPACE}/release"
          sha256sum -- * > SHA256SUMS.txt

      - name: Create release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.get-version.outputs.tag }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          cd release
          RELEASE_BODY="FFmpeg ${VERSION} static builds for Linux, Windows, macOS, FreeBSD (amd64/arm64)"

          if [ -n "${GITEA_TOKEN}" ]; then
            curl -sf -X DELETE -H "Authorization: token ${GITEA_TOKEN}" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/tags/${TAG}" || true

            RELEASE_ID=$(curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"FFmpeg ${VERSION}\",\"body\":\"${RELEASE_BODY}\"}" \
              | jq -r '.id')

            for file in *; do
              [ -f "$file" ] || continue
              curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
                -F "attachment=@${file}" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${file}"
            done
          else
            gh release delete "${TAG}" --repo "${REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${TAG}" --repo "${REPOSITORY}" --title "FFmpeg ${VERSION}" --notes "${RELEASE_BODY}" *
          fi
